<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#3b82f6"/>
  <g transform="translate(128, 128)">
    <!-- Mermaid-style flowchart icon -->
    <rect x="64" y="20" width="128" height="60" rx="8" fill="white" opacity="0.9"/>
    <line x1="128" y1="80" x2="128" y2="120" stroke="white" stroke-width="4"/>
    <polygon points="120,115 128,125 136,115" fill="white"/>
    <rect x="32" y="140" width="90" height="60" rx="8" fill="white" opacity="0.9"/>
    <rect x="134" y="140" width="90" height="60" rx="8" fill="white" opacity="0.9"/>
    <line x1="77" y1="80" x2="77" y2="140" stroke="white" stroke-width="4"/>
    <line x1="179" y1="80" x2="179" y2="140" stroke="white" stroke-width="4"/>
    <polygon points="73,135 77,145 81,135" fill="white"/>
    <polygon points="175,135 179,145 183,135" fill="white"/>
    <!-- Connection lines from top box to lower boxes -->
    <line x1="100" y1="80" x2="77" y2="120" stroke="white" stroke-width="3" opacity="0.8"/>
    <line x1="156" y1="80" x2="179" y2="120" stroke="white" stroke-width="3" opacity="0.8"/>
  </g>
</svg>
